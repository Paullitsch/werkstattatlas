name: Scrape Werkstattatlas

on:
  schedule:
    # Jeden Montag um 06:00 UTC
    - cron: '0 6 * * 1'
  workflow_dispatch: # Manuell ausführbar

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        run: python scraper.py

      - name: Generate stats
        run: |
          echo "## Scraper Stats" > data/stats.md
          echo "" >> data/stats.md
          echo "- **Letzte Aktualisierung:** $(date -u '+%Y-%m-%d %H:%M UTC')" >> data/stats.md
          echo "- **Einträge:** $(python -c 'import json; print(len(json.load(open("data/werkstaetten.json"))))')" >> data/stats.md
          echo "" >> data/stats.md
          echo "### Länder" >> data/stats.md
          python -c "
          import json
          data = json.load(open('data/werkstaetten.json'))
          countries = {}
          for e in data:
              cc = e.get('country_code', '??')
              countries[cc] = countries.get(cc, 0) + 1
          for cc, count in sorted(countries.items(), key=lambda x: -x[1]):
              print(f'- **{cc}**: {count}')
          " >> data/stats.md

      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "data: update werkstätten $(date -u '+%Y-%m-%d')"
            git push
          fi
